<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Para ti ❤️</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Georgia, serif;
  color: white;
  text-align: center;
  overflow: hidden;
  background: #120b12;
}

.fondo {
  position: fixed;
  inset: 0;
  background:
    linear-gradient(rgba(20,5,15,.45), rgba(20,5,15,.75)),
    url("20260809_1539.jpg") center/cover;
  filter: blur(3px);
  transform: scale(1.08);
  z-index: -2;
}

.contenido {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 25px;
  background: radial-gradient(
    circle,
    transparent 10%,
    rgba(0,0,0,.55) 100%
  );
}

.foto {
  width: min(78vw, 390px);
  border-radius: 25px;
  padding: 5px;
  background: linear-gradient(135deg,#fff8,#ffffff22);
  box-shadow: 0 20px 60px #0009;
}

.frase {
  max-width: 700px;
  font-size: clamp(28px,7vw,48px);
  line-height: 1.15;
  margin: 25px 0;
  text-shadow: 0 3px 20px #000;
}

.subtitulo {
  letter-spacing: 3px;
  font-size: 13px;
  opacity: .8;
  text-transform: uppercase;
}

button {
  border: 1px solid #ffffff66;
  border-radius: 30px;
  padding: 14px 25px;
  background: #ffffff1c;
  color: white;
  font-size: 15px;
  backdrop-filter: blur(10px);
}

</style>
</head>

<body>

<div class="fondo"></div>

<div class="contenido">

  <img src="20260809_153958.jpg" class="foto">

  <div class="subtitulo">
    Para la mas bella ❤️
  </div>

  <div class="frase">
    Te amaré hoy y siempre, mi amor, o hasta que la roca tenga pelo :>
  </div>

  </div>

  <button onclick="reproducir()">
    🎵 :>
  </button>

</div>

<script>

function reproducir() {

  window.open(
    "https://www.youtube.com/watch?v=loOWKm8GW6A",
    "_blank"
  );

}

</script>

</body>
</html>
